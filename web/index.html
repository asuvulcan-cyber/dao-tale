<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: sem ele, `env(safe-area-inset-*)` é sempre 0 e a
         barra da vitrine passa por baixo do notch/ilha do aparelho. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- A cor da barra do navegador no celular é acertada em JS (App.tsx), lendo
         o token --cor-papel: um hex aqui seria o único lugar do site fora do
         sistema de tokens, e ficaria errado no tema escuro. -->
    <meta name="theme-color" />
    <link rel="icon" type="image/svg+xml" href="/icone.svg" />
    <link rel="icon" type="image/png" sizes="256x256" href="/icone-256.png" />
    <title>Dao Tale</title>
    <script>
      // Anti-flash: aplica o tema salvo antes da primeira pintura.
      (function () {
        try {
          var t = localStorage.getItem('dao-tale-tema');
          if (t === 'claro' || t === 'escuro') {
            document.documentElement.setAttribute('data-theme', t === 'escuro' ? 'dark' : 'light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="raiz"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
